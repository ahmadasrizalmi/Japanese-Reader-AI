<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Komorebi Reader - Japanese Reader AI</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#7f2628",
            "primary-container": "#9e3d3d",
            "on-primary": "#ffffff",
            "on-primary-container": "#ffcac7",
            "secondary": "#a13e28",
            "crimson-deep": "#802B2B",
            "crimson-surface": "#F6E8E8",
            "canvas-secondary": "#F5EFEB",
            "surface": "#fcf9f7",
            "surface-card": "#ffffff",
            "surface-container": "#f0edeb",
            "surface-container-low": "#f6f3f1",
            "text-primary": "#2D2424",
            "text-secondary": "#6E6262",
            "text-muted": "#9C8E8E",
            "highlight-yellow": "#FEF3C7",
            "highlight-green": "#D1FAE5",
            "highlight-pink": "#FCE7F3",
            "highlight-blue": "#DBEAFE",
            "highlight-lavender": "#EDE9FE",
            "highlight-mint": "#D1F4E0"
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mincho: ['"Noto Serif JP"', '"MS Mincho"', 'serif'],
            gothic: ['"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      overscroll-behavior: none;
      background-color: #fcf9f7;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
    ::-webkit-scrollbar { display: none; }
    ruby rt {
      font-size: 0.52em;
      line-height: 1.2em;
      user-select: none;
    }
    .perspective-1000 { perspective: 1000px; -webkit-perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-surface text-text-primary min-h-screen flex antialiased selection:bg-highlight-pink selection:text-primary overflow-x-hidden">

  <!-- DESKTOP SIDEBAR (Sticky on screens >= 768px) -->
  <aside id="desktop-sidebar" class="hidden md:flex flex-col w-64 bg-surface-card border-r border-surface-container shrink-0 sticky top-0 h-screen z-30 justify-between p-5 select-none shadow-[2px_0_12px_rgba(0,0,0,0.02)]">
    <div class="flex flex-col gap-6">
      <!-- Logo & Brand Header -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-crimson-surface flex items-center justify-center p-1 shadow-sm">
          <img id="app-logo-desktop" alt="Logo" class="w-full h-full object-contain">
        </div>
        <div class="flex flex-col">
          <span class="text-[10px] uppercase font-bold tracking-widest text-primary">KOMOREBI</span>
          <span class="text-sm font-bold tracking-tight text-text-primary">Japanese Reader AI</span>
        </div>
      </div>

      <!-- Primary Action: + Tambah Teks Baru -->
      <button id="sidebar-add-btn" class="w-full py-3 px-4 rounded-xl bg-primary text-white font-bold text-xs shadow-md hover:bg-primary-container active:scale-98 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">add_circle</span>
        <span>Tambah Teks Baru</span>
      </button>

      <!-- Navigation Links -->
      <nav class="flex flex-col gap-1.5" id="desktop-nav">
        <button class="desktop-nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all text-primary bg-crimson-surface" data-view="koleksi">
          <span class="material-symbols-outlined text-[20px]">menu_book</span>
          <span>Koleksi Bacaan</span>
        </button>

        <button class="desktop-nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all text-text-secondary hover:text-primary hover:bg-canvas-secondary" data-view="flashcards">
          <span class="material-symbols-outlined text-[20px]">style</span>
          <span>Flashcard SRS</span>
        </button>

        <button class="desktop-nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all text-text-secondary hover:text-primary hover:bg-canvas-secondary" data-view="progress">
          <span class="material-symbols-outlined text-[20px]">insights</span>
          <span>Kemajuan Belajar</span>
        </button>

        <button class="desktop-nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all text-text-secondary hover:text-primary hover:bg-canvas-secondary" data-view="settings">
          <span class="material-symbols-outlined text-[20px]">tune</span>
          <span>Pengaturan</span>
        </button>
      </nav>
    </div>

    <!-- Sidebar Bottom: Cloudflare Sync Status Badge -->
    <div class="pt-4 border-t border-surface-container flex flex-col gap-2">
      <button id="desktop-sync-btn" class="flex items-center justify-between p-2.5 rounded-xl bg-canvas-secondary/80 hover:bg-crimson-surface transition-colors text-left" title="Sinkronkan data ke Cloudflare">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px] text-primary" id="desktop-sync-icon">cloud_done</span>
          <div class="flex flex-col">
            <span class="text-[11px] font-bold text-text-primary" id="desktop-sync-text">Cloudflare Edge</span>
            <span class="text-[10px] text-text-muted">Tersambung (Aktif)</span>
          </div>
        </div>
        <span class="material-symbols-outlined text-[16px] text-text-muted">sync</span>
      </button>
      <span class="text-[10px] text-text-muted text-center">v1.5.2 Desktop Edition</span>
    </div>
  </aside>

  <!-- MAIN VIEWPORT WRAPPER -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto" id="main-scroll-wrapper">
    <!-- MOBILE TOP BAR (Only visible on screens < 768px) -->
    <header id="top-app-bar" class="md:hidden sticky top-0 w-full z-40 bg-surface/90 backdrop-blur-xl border-b border-surface-container pt-safe">
      <div class="h-16 px-4 flex items-center justify-between gap-3 max-w-2xl mx-auto">
        <div class="flex items-center gap-2.5 min-w-0">
          <img id="app-logo-mobile" alt="Komorebi Reader AI" class="h-9 w-9 rounded-xl object-cover shadow-sm bg-crimson-surface p-0.5">
          <div class="flex flex-col min-w-0">
            <span class="text-[10px] uppercase font-bold tracking-widest text-primary">Komorebi</span>
            <h1 id="top-title" class="text-base font-bold text-text-primary tracking-tight truncate">Japanese Reader AI</h1>
          </div>
        </div>

        <button id="sync-trigger-btn" class="flex items-center gap-1.5 px-3 py-1 bg-crimson-surface text-primary rounded-full text-xs font-semibold hover:bg-primary hover:text-white transition-all shadow-sm">
          <span class="material-symbols-outlined text-[16px]" id="sync-icon">cloud_done</span>
          <span id="sync-text">Cloud Sync</span>
        </button>
      </div>
    </header>

    <!-- MAIN APP CONTENT -->
    <main class="flex-1 w-full pb-28 md:pb-12 pt-3" id="main-container">
      <div id="view-container" class="w-full"></div>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION (Only visible on screens < 768px) -->
    <nav id="bottom-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 pb-safe bg-surface/95 backdrop-blur-xl border-t border-surface-container shadow-[0_-4px_20px_rgba(128,43,43,0.06)]">
      <div class="flex justify-around items-center h-16 px-2 max-w-2xl mx-auto">
        <button class="nav-item flex flex-col items-center justify-center gap-1 flex-1 text-primary transition-colors" data-view="koleksi">
          <span class="material-symbols-outlined text-[20px]">menu_book</span>
          <span class="text-[10px] font-bold">Koleksi</span>
        </button>

        <button class="nav-item flex flex-col items-center justify-center gap-1 flex-1 text-text-muted hover:text-primary transition-colors" data-view="flashcards">
          <span class="material-symbols-outlined text-[20px]">style</span>
          <span class="text-[10px] font-semibold">Flashcard</span>
        </button>

        <div class="flex items-center justify-center flex-1">
          <button id="nav-add-btn" class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center shadow-lg active:scale-95 transition-transform hover:bg-primary-container" title="Tambah Bahan Bacaan Baru">
            <span class="material-symbols-outlined text-[24px]">add</span>
          </button>
        </div>

        <button class="nav-item flex flex-col items-center justify-center gap-1 flex-1 text-text-muted hover:text-primary transition-colors" data-view="progress">
          <span class="material-symbols-outlined text-[20px]">insights</span>
          <span class="text-[10px] font-semibold">Kemajuan</span>
        </button>

        <button class="nav-item flex flex-col items-center justify-center gap-1 flex-1 text-text-muted hover:text-primary transition-colors" data-view="settings">
          <span class="material-symbols-outlined text-[20px]">tune</span>
          <span class="text-[10px] font-semibold">Pengaturan</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- MODAL CONTAINER (Centered Dialog on Desktop, Bottom Sheet on Mobile) -->
  <div id="modal-container" class="hidden"></div>

  <script type="module" src="src/main.ts"></script>
</body>
</html>
